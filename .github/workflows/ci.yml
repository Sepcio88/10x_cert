name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  # CD: deploy to Cloudflare Workers only after lint→test→build is green,
  # and only on a direct push to main (never on PRs).
  deploy:
    name: Deploy (Cloudflare Workers)
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # Fail fast if any required secret is missing/empty — otherwise the deploy
      # would silently ship a site with undefined runtime config (auth/gen broken).
      - name: Verify required secrets are set
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=()
          for v in SUPABASE_URL SUPABASE_KEY OPENROUTER_API_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!v}" ]; then missing+=("$v"); fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing or empty required GitHub secrets: ${missing[*]}"
            exit 1
          fi
          echo "All required secrets present."
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - name: Build
        run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      # Deploy first so the Worker exists (auto-provisions the SESSION KV namespace).
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Then sync runtime secrets to the live Worker (separate store from CI build env).
      - name: Sync runtime secrets to Worker
        run: |
          jq -n \
            --arg SUPABASE_URL "$SUPABASE_URL" \
            --arg SUPABASE_KEY "$SUPABASE_KEY" \
            --arg OPENROUTER_API_KEY "$OPENROUTER_API_KEY" \
            '{SUPABASE_URL:$SUPABASE_URL, SUPABASE_KEY:$SUPABASE_KEY, OPENROUTER_API_KEY:$OPENROUTER_API_KEY}' \
            > "$RUNNER_TEMP/cf-secrets.json"
          npx wrangler secret bulk "$RUNNER_TEMP/cf-secrets.json"
          rm -f "$RUNNER_TEMP/cf-secrets.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
